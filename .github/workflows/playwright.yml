name: Playwright Tests from Dockerfile

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      USER_EMAIL: ${{ secrets.USER_EMAIL }}
      USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
      HTTP_USERNAME: ${{ secrets.HTTP_USERNAME }}
      HTTP_PASSWORD: ${{ secrets.HTTP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t playwright-tests .

      - name: Create report folders
        run: |
          mkdir -p playwright-report
          mkdir -p test-results

      - name: Run Playwright tests in Docker
        run: |
          docker run --rm --init --ipc=host \
            -e BASE_URL="${BASE_URL}" \
            -e USER_EMAIL="${USER_EMAIL}" \
            -e USER_PASSWORD="${USER_PASSWORD}" \
            -e HTTP_USERNAME="${HTTP_USERNAME}" \
            -e HTTP_PASSWORD="${HTTP_PASSWORD}" \
            -e CI=true \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            -v ${{ github.workspace }}/test-results:/app/test-results \
            playwright-tests

      - name: Show files after tests
        if: always()
        run: |
          pwd
          ls -la
          ls -la playwright-report || true
          ls -la test-results || true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7